server:
  port: ${APP_PORT:8082}
spring:
  application:
    name: storage-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:192.168.186.131:8848}
        enabled: ${NACOS_ENABLED:true}
    sentinel:
      # Sentinel 控制台地址，控制台通过 Nacos V2 接口向配置中心推送规则。
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.186.131:8858}
        port: ${SENTINEL_CLIENT_PORT:8720}
      datasource:
        # Push 模式：应用只监听 Nacos，规则由控制台写入 Nacos。
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.186.131:8848}
            data-id: ${spring.application.name}-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:192.168.186.131:8848}
            data-id: ${spring.application.name}-degrade-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.186.131}:${DB_PORT:3306}/seata_storage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
seata:
  enabled: true
  tx-service-group: demo_tx_group
  registry:
    type: file
  service:
    vgroup-mapping:
      demo_tx_group: default
    grouplist:
      default: ${SEATA_ADDR:192.168.186.131:8091}
  data-source-proxy-mode: AT
  client:
    rm:
      lock:
        # 全局锁默认只等 30*10ms=300ms，热行并发时容易 Global lock acquire failed
        retry-interval: 50
        retry-times: 100
